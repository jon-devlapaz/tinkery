name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Official Seed Me contract fixture (not vendored)
        uses: actions/checkout@v4
        with:
          repository: jon-devlapaz/tink-skills
          ref: 86066b175b53e13b4180ce4cc9929a626b57a2f6
          path: .ci-seed-me
      - name: Seed Me test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests (Tinkery and vendored Pinstar)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Resolve the ephemeral macOS runner name locally
        if: runner.os == 'macOS'
        run: |
          echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
          echo "::1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Official viewer startup diagnostic (isolated TEST process)
        if: runner.os == 'macOS'
        env:
          SEED_ME_TEST_SKILL: ${{ github.workspace }}/.ci-seed-me/skills/seed-me/SKILL.md
        run: python3 examples/seed_viewer_probe.py
      - name: Terminal journeys (real binary in a pseudo-terminal)
        env:
          SEED_ME_TEST_SKILL: ${{ github.workspace }}/.ci-seed-me/skills/seed-me/SKILL.md
        shell: bash
        run: |
          for t in tests/*.py; do
            case "$t" in tests/vt_screen.py) continue;; esac
            echo "== $t"; python3 "$t"
          done
