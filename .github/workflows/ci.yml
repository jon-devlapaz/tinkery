name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request replaces its unfinished run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      setup: ${{ steps.classify.outputs.setup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Routing and gate regression tests
        run: python3 tests/test_ci_scope.py
      - name: Classify committed changes
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 scripts/ci-scope.py --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
  docs:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation contracts
        run: |
          python3 tests/test_documentation.py
          python3 tests/test_planning_docs.py
          python3 tests/test_job_record_docs.py
  check:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # Pull requests gate on Ubuntu; pushes to main add macOS and the slow journeys.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Full guarded zero-call verification
        env:
          TINKERY_TEST_SDLC_REF: 6eee1f1d3f2035983c01b3c61b51f0afb5dccf19
          TINKERY_TEST_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        run: python3 scripts/full-check.py
  cold-clone:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.setup != 'false'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Fresh Linux clone, idempotent setup, documented commands
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TINKERY_TEST_TIER: pr
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          export HOME=$(mktemp -d "$RUNNER_TEMP/tinkery-TEST-home.XXXXXX")
          unset CARGO_HOME RUSTUP_HOME
          cold=$(mktemp -d "$RUNNER_TEMP/tinkery-cold.XXXXXX")
          git clone --single-branch --branch "$HEAD_REF" "$HEAD_REPO" "$cold"
          cd "$cold"
          git checkout --detach "$HEAD_SHA"
          echo "Cold source: $(git rev-parse HEAD)"
          ./scripts/cloud-setup.sh
          ./scripts/cloud-setup.sh
          python3 scripts/full-check.py
          ./scripts/cloud-setup.sh
          test -z "$(git status --porcelain --untracked-files=all)"
  ready:
    name: CI ready
    if: always()
    needs: [scope, docs, check, cold-clone]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SETUP: ${{ needs.scope.outputs.setup }}
          EVENT: ${{ github.event_name }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          COLD_RESULT: ${{ needs.cold-clone.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$DOCS_ONLY:$EVENT" in
            true:pull_request|true:push)
              test "$DOCS_RESULT" = success
              test "$CHECK_RESULT" = skipped
              test "$COLD_RESULT" = skipped
              message="Documentation checks passed; runtime and cold-clone checks were not applicable."
              ;;
            false:pull_request|false:push)
              test "$DOCS_RESULT" = skipped
              test "$CHECK_RESULT" = success
              case "$EVENT:$SETUP" in
                pull_request:true) test "$COLD_RESULT" = success ;;
                pull_request:false|push:true|push:false) test "$COLD_RESULT" = skipped ;;
                *) echo "Unknown setup route" >&2; exit 1 ;;
              esac
              message="Full verification passed; cold-clone checks run on pull requests that change setup."
              ;;
            *) echo "Unknown CI route or event" >&2; exit 1 ;;
          esac
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
