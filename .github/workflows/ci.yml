name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Official Seed Me contract fixture (not vendored)
        uses: actions/checkout@v4
        with:
          repository: jon-devlapaz/seed-me
          ref: 1a2f31a136d53bceff51ae8c2e0e787c1a8a90bb
          path: .ci-seed-me
      - name: Seed Me test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests (Tinkery and vendored Pinstar)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Local voice helper (fake-only; runner Node is required)
        run: node --test voice/*.test.mjs
      - name: Terminal journeys (real binary in a pseudo-terminal)
        env:
          TINKERY_NODE: /tinkery-TEST-no-node
          SEED_ME_TEST_SKILL: ${{ github.workspace }}/.ci-seed-me/skills/seed-me/SKILL.md
        shell: bash
        run: |
          for t in tests/*.py; do
            case "$t" in tests/vt_screen.py) continue;; esac
            echo "== $t"; python3 "$t"
          done
