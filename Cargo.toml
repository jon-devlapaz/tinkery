[package]
name = "tinkery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
pinstar = { path = "vendor/pinstar", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["vendor/pinstar"]
default-members = ["."]
resolver = "3"
