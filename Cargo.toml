[package]
name = "tinkery"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52"] }
ratatui-textarea = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"
pinstar = { path = "vendor/pinstar", default-features = false }
graf = { package = "graf-rs", path = "vendor/graf" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
time = { version = "0.3", features = ["parsing"] }

tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[workspace]
members = ["vendor/pinstar", "vendor/graf"]
default-members = ["."]
resolver = "3"

[[example]]
name = "think_eval"
test = true
